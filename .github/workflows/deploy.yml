name: Web Deployment
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
jobs:
  deploy:
    name: Deploy
    environment: Production
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        working-directory: src/app
        run: bun install --frozen-lockfile

      - name: Build Project
        working-directory: src/app
        run: bun run build
        env:
          VISION_OBJECT_MODEL: ${{ vars.VISION_OBJECT_MODEL }}
          VISION_VEHICLE_MODEL: ${{ vars.VISION_VEHICLE_MODEL }}

      - name: Migrate Database
        working-directory: src/app
        run: bun run db:migrate --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: src/app
          secrets: |
            BETTER_AUTH_SECRET
            BETTER_AUTH_URL
            OPENROUTER_API_KEY
            OPENROUTER_MODEL
            OPENROUTER_REFERER
            OPENROUTER_TITLE
            ROBOFLOW_API_KEY
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_REFERER: ${{ vars.OPENROUTER_REFERER }}
          OPENROUTER_TITLE: ${{ vars.OPENROUTER_TITLE }}
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
