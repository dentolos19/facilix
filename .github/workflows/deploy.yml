name: Web Deployment
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
jobs:
  deploy-app:
    name: Deploy App
    environment: Production
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        working-directory: src/app
        run: bun install --frozen-lockfile

      - name: Build Project
        working-directory: src/app
        env:
          VITE_SIMULATOR_URL: ${{ vars.SIMULATOR_URL }}
          VISION_OBJECT_MODEL: ${{ vars.VISION_OBJECT_MODEL }}
          VISION_VEHICLE_MODEL: ${{ vars.VISION_VEHICLE_MODEL }}
        run: bun run build

      - name: Migrate Database
        working-directory: src/app
        run: bun run db:migrate --remote

      - name: Deploy App
        uses: dentolos19/dentolos19/actions/deploy-cloudflare-worker@main
        with:
          working-directory: src/app
          secrets: |
            APP_URL
            SERVER_SECRET
            BETTER_AUTH_URL
            BETTER_AUTH_SECRET
            OPENROUTER_API_KEY
            OPENROUTER_TITLE
            OPENROUTER_REFERER
            OPENROUTER_MODEL
            ROBOFLOW_API_KEY
            SIMULATOR_URL
            SIMULATOR_TOKEN
            FLY_API_TOKEN
            FLY_APP_NAME
        env:
          APP_URL: ${{ vars.APP_URL }}
          SERVER_SECRET: ${{ secrets.SERVER_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_TITLE: ${{ vars.OPENROUTER_TITLE }}
          OPENROUTER_REFERER: ${{ vars.OPENROUTER_REFERER }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
          SIMULATOR_URL: ${{ vars.SIMULATOR_URL }}
          SIMULATOR_TOKEN: ${{ secrets.SIMULATOR_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ vars.FLY_APP_NAME }}

  deploy-simulator:
    name: Deploy Simulator
    environment: Production
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Deploy Simulator
        uses: dentolos19/dentolos19/actions/deploy-fly-app@main
        with:
          working-directory: src/simulator
          secrets: |
            SIMULATOR_TOKEN
        env:
          SIMULATOR_TOKEN: ${{ secrets.SIMULATOR_TOKEN }}
