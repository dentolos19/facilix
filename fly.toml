app = "facilix"
primary_region = "sin"

[build]
dockerfile = "src/simulator/Dockerfile"

[[services]]
internal_port = 8000
protocol = "tcp"

[[services.ports]]
handlers = ["http"]
port = 80

[[services.ports]]
handlers = ["tls"]
port = 443

[[services.tcp_checks]]
interval = "15s"
timeout = "5s"
grace_period = "10s"
