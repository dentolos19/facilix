services:
  simulator:
    build:
      context: .
      dockerfile: src/simulator/Dockerfile
    container_name: facilix-simulator
    restart: unless-stopped
    ports:
      - "3002:8000" # HTTP API + HLS
      - "3003:8554" # RTSP
    volumes:
      - ./samples:/samples:ro
    environment:
      SIMULATOR_VIDEOS_DIR: /samples
      SIMULATOR_SAMPLES_DIR: /samples
      SIMULATOR_VIDEOS_MANIFEST: /samples/videos.json
      SIMULATOR_LOG_LEVEL: info
      SENSOR_DEFAULT_INTERVAL_SECONDS: "5"
      SENSOR_HISTORY_LIMIT: "500"
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
