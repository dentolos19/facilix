app = "facilix"
primary_region = "sin"

[[vm]]
cpus = 1
memory_mb = 1024

[[services]]
internal_port = 8000
protocol = 'tcp'
auto_start_machines = false
auto_stop_machines = true

[[services.ports]]
port = 80
handlers = ["http"]

[[services.ports]]
port = 443
handlers = ["tls"]

[[services.tcp_checks]]
interval = "15s"
timeout = "5s"
grace_period = "10s"
