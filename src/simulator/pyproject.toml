[project]
name = "facilix-simulator"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115.0", "uvicorn[standard]>=0.34.0"]

[dependency-groups]
dev = ["ruff"]

[tool.setuptools]
py-modules = ["main", "config", "cctv", "sensor_models", "sensor_engine", "sensor_routes"]

[tool.ruff]
line-length = 120
