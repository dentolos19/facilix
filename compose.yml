services:
  simulator:
    build:
      context: src/simulator
    container_name: facilix-simulator
    restart: unless-stopped
    env_file:
      - ./src/simulator/.env
    ports:
      - "3002:8000"
      - "3003:8554"
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8000/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
